[project]
name = "podcast-intelligence-agent"
version = "0.1.0"
description = "Personal podcast intelligence application built with the OpenAI Responses API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "httpx2>=2.10.0",
    "imageio-ffmpeg>=0.6.0",
    "openai>=3.1.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
podcast-intelligence = "podcast_intelligence.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_intelligence"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-m", "not integration"]
testpaths = ["tests"]
markers = ["integration: requires network access and live service credentials"]

[tool.coverage.run]
branch = true
source = ["podcast_intelligence"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "types-defusedxml>=0.7.0.20260504",
]
